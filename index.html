<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Editor</title>
<style>
  :root {
    --bg: #09090b;
    --panel: #18181b;
    --line: #27272a;
    --text: #e4e4e7;
    --muted: #a1a1aa;
    --accent: #d4a24c;
    --ctrl: #60a5fa;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  select, button, input, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  select, button { padding: 4px 8px; }
  button { cursor: pointer; }
  label { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  #canvas { display: block; width: 100%; max-width: 560px; aspect-ratio: 1; background: var(--panel); border-radius: 8px; touch-action: none; user-select: none; }
  #canvas.draw, #canvas.draw .handle { cursor: crosshair; }
  .tools { display: inline-flex; gap: 4px; }
  button.active { border-color: var(--accent); color: var(--accent); }
  .status { display: flex; gap: 16px; max-width: 560px; color: var(--muted); min-height: 1.4em; margin: 4px 0 12px; }
  #hover { font-variant-numeric: tabular-nums; }
  .previews { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
  .chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); }
  .chip--light { background: #fafafa; color: #18181b; }
  .chip svg { display: block; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 6px; }
  textarea { width: 100%; max-width: 560px; padding: 8px; font: 12px/1.5 ui-monospace, monospace; resize: vertical; }
  #error { color: var(--error); min-height: 1.4em; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td, th { padding: 2px 8px 2px 0; text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td input { width: 72px; padding: 2px 4px; }
  tr.selected td:first-child { color: var(--accent); font-weight: 700; }
  pre { max-width: 560px; white-space: pre-wrap; word-break: break-all; background: var(--panel); padding: 8px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="bar">
    <select id="file"></select>
    <span class="tools"><button id="tool-select" class="active" title="Select (V)">Select</button><button id="tool-pen" title="Pen (P)">Pen</button><button id="tool-circle" title="Circle (C)">Circle</button></span>
    <label>Snap <select id="snap"><option value="0.25">0.25</option><option value="0.75">0.75</option><option value="0.125">0.125</option><option value="0">off</option></select></label>
    <label><input type="checkbox" id="link" checked> Move joined points together</label>
    <label><input type="checkbox" id="controls" checked> Curve handles</label>
    <button id="undo" title="Cmd+Z">Undo</button>
  </div>

  <svg id="canvas" viewBox="-1 -1 26 26" xmlns="http://www.w3.org/2000/svg">
    <g id="grid"></g>
    <g id="shape" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path id="shapePath"/></g>
    <g id="guides"></g>
    <g id="pen" pointer-events="none"></g>
    <g id="handles"></g>
  </svg>
  <div class="status"><span id="hover">&nbsp;</span><span id="hint"></span></div>

  <div class="previews" id="previews"></div>

  <h2>Path data</h2>
  <textarea id="d" rows="3" spellcheck="false"></textarea>
  <div id="error"></div>

  <h2>Points</h2>
  <table><thead><tr><th>#</th><th>Cmd</th><th>x</th><th>y</th><th></th></tr></thead><tbody id="points"></tbody></table>

  <h2>Clean SVG</h2>
  <button id="copy">Copy</button>
  <pre id="out"></pre>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const state = { file: '', mode: 'stroke', segs: [], history: [], selected: null, tool: 'select', penActive: false, circleStart: null };

const ARGS = { M: 2, L: 2, H: 1, V: 1, C: 6, S: 4, Q: 4, T: 2, A: 7, Z: 0 };

function parse(d) {
  let i = 0, cmd = null;
  const out = [];
  const ws = () => { while (i < d.length && /[\s,]/.test(d[i])) i++; };
  const num = () => {
    ws();
    const m = /^[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?/.exec(d.slice(i));
    if (!m) throw new Error(`Number expected at character ${i}`);
    i += m[0].length;
    return +m[0];
  };
  /** Arc flags may be written without separators, e.g. "a1 1 0 011 1". */
  const flag = () => {
    ws();
    if (d[i] !== '0' && d[i] !== '1') throw new Error(`Arc flag expected at character ${i}`);
    return +d[i++];
  };
  for (;;) {
    ws();
    if (i >= d.length) break;
    if (/[a-zA-Z]/.test(d[i])) {
      cmd = d[i++];
      if (!(cmd.toUpperCase() in ARGS)) throw new Error(`Unknown command "${cmd}"`);
    } else if (!cmd) {
      throw new Error('Command expected');
    }
    const U = cmd.toUpperCase();
    if (U === 'Z') { out.push({ c: cmd, a: [] }); cmd = null; continue; }
    const a = U === 'A'
      ? [num(), num(), num(), flag(), flag(), num(), num()]
      : Array.from({ length: ARGS[U] }, num);
    out.push({ c: cmd, a });
    if (cmd === 'M') cmd = 'L';
    else if (cmd === 'm') cmd = 'l';
  }
  return out;
}

/** Converts every command to absolute M, L, C, Q, A or Z, so each point has one editable position. */
function absolutize(raw) {
  let x = 0, y = 0, sx = 0, sy = 0, lastCtrl = null, lastCmd = null;
  return raw.map(({ c, a }) => {
    const rel = c !== c.toUpperCase();
    const ox = rel ? x : 0, oy = rel ? y : 0;
    const pt = (i) => [a[i] + ox, a[i + 1] + oy];
    const mirror = (kind) => (lastCmd === kind && lastCtrl ? [2 * x - lastCtrl[0], 2 * y - lastCtrl[1]] : [x, y]);
    let s;
    switch (c.toUpperCase()) {
      case 'M': s = { c: 'M', p: [pt(0)] }; break;
      case 'L': s = { c: 'L', p: [pt(0)] }; break;
      case 'H': s = { c: 'L', p: [[a[0] + ox, y]] }; break;
      case 'V': s = { c: 'L', p: [[x, a[0] + oy]] }; break;
      case 'C': s = { c: 'C', p: [pt(0), pt(2), pt(4)] }; break;
      case 'S': s = { c: 'C', p: [mirror('C'), pt(0), pt(2)] }; break;
      case 'Q': s = { c: 'Q', p: [pt(0), pt(2)] }; break;
      case 'T': s = { c: 'Q', p: [mirror('Q'), pt(0)] }; break;
      case 'A': s = { c: 'A', arc: a.slice(0, 5), p: [pt(5)] }; break;
      default: s = { c: 'Z', p: [] };
    }
    if (s.c === 'Z') { x = sx; y = sy; } else { [x, y] = s.p[s.p.length - 1]; }
    if (s.c === 'M') { sx = x; sy = y; }
    lastCtrl = s.c === 'C' || s.c === 'Q' ? s.p[s.p.length - 2] : null;
    lastCmd = s.c;
    return s;
  });
}

const fmt = (n) => String(+n.toFixed(3));
const serialize = (segs) => segs
  .map((s) => (s.c === 'Z' ? 'Z' : s.c + [...(s.arc ?? []), ...s.p.flat()].map(fmt).join(' ')))
  .join(' ');

function cleanSvg() {
  const d = serialize(state.segs);
  return state.mode === 'stroke'
    ? `<svg xmlns="${NS}" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>\n`
    : `<svg xmlns="${NS}" fill="currentColor" viewBox="0 0 24 24"><path d="${d}"/></svg>\n`;
}

/** Flat list of every editable point: end points get a number, curve handles get "n·a" and "n·b". */
function points() {
  const list = [];
  let n = 0;
  state.segs.forEach((s, si) => {
    if (!s.p.length) return;
    n++;
    s.p.forEach((p, pi) => {
      const end = pi === s.p.length - 1;
      list.push({ si, pi, end, label: end ? String(n) : `${n}·${'ab'[pi]}`, cmd: s.c });
    });
  });
  return list;
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent?.appendChild(e);
  return e;
}

function drawGrid() {
  const g = $('grid');
  for (let i = 0; i <= 24; i++) {
    const strong = i % 12 === 0 ? 0.06 : 0.025;
    el('line', { x1: i, y1: 0, x2: i, y2: 24, stroke: '#3f3f46', 'stroke-width': strong }, g);
    el('line', { x1: 0, y1: i, x2: 24, y2: i, stroke: '#3f3f46', 'stroke-width': strong }, g);
  }
  el('rect', { x: 2, y: 2, width: 20, height: 20, fill: 'none', stroke: '#52525b', 'stroke-width': 0.04, 'stroke-dasharray': '0.3 0.3' }, g);
  for (let i = 0; i <= 24; i += 6) {
    el('text', { x: i, y: -0.3, 'font-size': 0.55, fill: '#71717a', 'text-anchor': 'middle' }, g).textContent = i;
    el('text', { x: -0.35, y: i + 0.2, 'font-size': 0.55, fill: '#71717a', 'text-anchor': 'end' }, g).textContent = i;
  }
}

function render({ rebuild = true } = {}) {
  const d = serialize(state.segs);
  $('shapePath').setAttribute('d', d);
  $('shape').setAttribute('fill', state.mode === 'fill' ? 'rgba(228,228,231,.25)' : 'none');
  if (document.activeElement !== $('d')) $('d').value = d;
  $('out').textContent = cleanSvg();
  renderPreviews();
  renderGuides();
  if (rebuild) { renderHandles(); renderTable(); } else { moveHandles(); fillTable(); }
}

function renderPreviews() {
  const svg = cleanSvg();
  const chip = (size, light, text) => `<span class="chip${light ? ' chip--light' : ''}">${svg.replace('<svg ', `<svg width="${size}" height="${size}" `)}${text ?? ''}</span>`;
  const name = state.file.replace(/(-icon)?\.svg$/, '');
  $('previews').innerHTML = chip(96) + chip(22, false, name) + chip(16) + chip(22, true, name);
}

function renderGuides() {
  const g = $('guides');
  g.innerHTML = '';
  if (!$('controls').checked) return;
  let prev = null;
  for (const s of state.segs) {
    if (s.c === 'C') {
      el('line', { x1: prev[0], y1: prev[1], x2: s.p[0][0], y2: s.p[0][1], stroke: 'var(--ctrl)', 'stroke-width': 0.05 }, g);
      el('line', { x1: s.p[2][0], y1: s.p[2][1], x2: s.p[1][0], y2: s.p[1][1], stroke: 'var(--ctrl)', 'stroke-width': 0.05 }, g);
    } else if (s.c === 'Q') {
      el('polyline', { points: [prev, s.p[0], s.p[1]].map((p) => p.join(',')).join(' '), fill: 'none', stroke: 'var(--ctrl)', 'stroke-width': 0.05 }, g);
    }
    if (s.p.length) prev = s.p[s.p.length - 1];
  }
}

function renderHandles() {
  const g = $('handles');
  g.innerHTML = '';
  const shown = points().filter((pt) => pt.end || $('controls').checked);
  /** Points at one spot share one handle, labelled "1, 4", so no label hides another. */
  const spots = new Map();
  for (const pt of shown) {
    const key = state.segs[pt.si].p[pt.pi].map(fmt).join(',') + pt.end;
    if (spots.has(key)) spots.get(key).label += `, ${pt.label}`;
    else spots.set(key, { ...pt });
  }
  for (const pt of spots.values()) {
    const grp = el('g', { class: 'handle', 'data-si': pt.si, 'data-pi': pt.pi, cursor: 'grab' }, g);
    const selected = state.selected && state.selected.si === pt.si && state.selected.pi === pt.pi;
    if (pt.end) el('circle', { r: 0.4, fill: selected ? 'var(--accent)' : '#fafafa', stroke: '#09090b', 'stroke-width': 0.08 }, grp);
    else el('rect', { x: -0.28, y: -0.28, width: 0.56, height: 0.56, fill: 'var(--ctrl)', stroke: '#09090b', 'stroke-width': 0.06 }, grp);
    const t = el('text', { x: 0.5, y: -0.5, 'font-size': 0.75, 'font-weight': 700, fill: pt.end ? 'var(--accent)' : 'var(--ctrl)', stroke: '#09090b', 'stroke-width': 0.18, 'paint-order': 'stroke' }, grp);
    t.textContent = pt.label;
  }
  moveHandles();
}

function moveHandles() {
  for (const grp of $('handles').children) {
    const [x, y] = state.segs[grp.dataset.si].p[grp.dataset.pi];
    grp.setAttribute('transform', `translate(${x} ${y})`);
  }
}

function renderTable() {
  const tb = $('points');
  tb.innerHTML = '';
  for (const pt of points()) {
    const tr = document.createElement('tr');
    tr.dataset.si = pt.si;
    tr.dataset.pi = pt.pi;
    if (state.selected && state.selected.si === pt.si && state.selected.pi === pt.pi) tr.className = 'selected';
    tr.innerHTML = `<td>${pt.label}</td><td>${pt.end ? pt.cmd : ''}</td><td><input data-axis="0" type="number" step="0.25"></td><td><input data-axis="1" type="number" step="0.25"></td>${pt.cmd === 'A' && pt.end ? '<td>r <input data-r type="number" step="0.25" min="0"></td>' : ''}`;
    tb.appendChild(tr);
  }
  fillTable();
}

function fillTable() {
  for (const tr of $('points').children) {
    const p = state.segs[tr.dataset.si].p[tr.dataset.pi];
    tr.querySelectorAll('input').forEach((inp) => {
      if (document.activeElement === inp) return;
      inp.value = fmt('r' in inp.dataset ? state.segs[tr.dataset.si].arc[0] : p[inp.dataset.axis]);
    });
  }
}

function remember() {
  const d = serialize(state.segs);
  if (state.history[state.history.length - 1] !== d) state.history.push(d);
}

function undo() {
  const current = serialize(state.segs);
  while (state.history.length && state.history[state.history.length - 1] === current) state.history.pop();
  const prev = state.history.pop();
  if (prev == null) return;
  resetDraft();
  state.segs = absolutize(parse(prev));
  render();
}

const same = (a, b) => Math.abs(a[0] - b[0]) < 1e-6 && Math.abs(a[1] - b[1]) < 1e-6;

/** All points at the same spot as the grabbed one, so a shared corner moves as one. */
function joined(si, pi) {
  const origin = state.segs[si].p[pi];
  if (!$('link').checked) return [[si, pi]];
  const refs = [];
  state.segs.forEach((s, i) => s.p.forEach((p, j) => { if (same(p, origin)) refs.push([i, j]); }));
  return refs;
}

function snap(v) {
  const step = +$('snap').value;
  return step ? Math.round(v / step) * step : +v.toFixed(3);
}

function toSvg(evt) {
  const pt = new DOMPoint(evt.clientX, evt.clientY).matrixTransform($('canvas').getScreenCTM().inverse());
  return [snap(pt.x), snap(pt.y)];
}

const TOOL_HINTS = {
  select: '',
  pen: 'Click to add points. Esc, Enter or double-click ends the line.',
  circle: 'Click two points on the circle. They become its diameter. Set r in the table for a bigger circle.',
};

function setTool(tool) {
  endDraft();
  state.tool = tool;
  $('canvas').classList.toggle('draw', tool !== 'select');
  for (const t of Object.keys(TOOL_HINTS)) $(`tool-${t}`).classList.toggle('active', t === tool);
  $('hint').textContent = TOOL_HINTS[tool];
}

function endDraft() {
  endPen();
  state.circleStart = null;
  $('pen').innerHTML = '';
}

/** Drops an open pen line or circle without an edit, for when the path is replaced. */
function resetDraft() {
  state.penActive = false;
  state.circleStart = null;
  $('pen').innerHTML = '';
}

/** A click on a handle uses that exact point, so new lines and circles join the shape. */
function pickPoint(evt) {
  const grp = evt.target.closest('.handle');
  return grp ? [...state.segs[grp.dataset.si].p[grp.dataset.pi]] : toSvg(evt);
}

/** Ends the current pen line. A start point with no line after it is removed. */
function endPen() {
  if (!state.penActive) return;
  state.penActive = false;
  $('pen').innerHTML = '';
  if (state.segs[state.segs.length - 1]?.c === 'M') state.segs.pop();
  render();
}

function penClick(evt) {
  const p = pickPoint(evt);
  const last = state.segs[state.segs.length - 1];
  if (state.penActive && same(last.p[last.p.length - 1], p)) return;
  remember();
  state.segs.push({ c: state.penActive ? 'L' : 'M', p: [p] });
  state.penActive = true;
  render();
}

function drawPenLine(evt) {
  const g = $('pen');
  g.innerHTML = '';
  if (!state.penActive) return;
  const last = state.segs[state.segs.length - 1].p.at(-1);
  const [x, y] = toSvg(evt);
  el('line', { x1: last[0], y1: last[1], x2: x, y2: y, stroke: 'var(--accent)', 'stroke-width': 0.08, 'stroke-dasharray': '0.3 0.2' }, g);
}

/** The second arc takes the large-arc flag, so a bigger r still draws one full circle through both points. */
function circleClick(evt) {
  const p = pickPoint(evt);
  const a = state.circleStart;
  if (!a) { state.circleStart = p; drawCirclePreview(evt); return; }
  state.circleStart = null;
  $('pen').innerHTML = '';
  if (same(a, p)) return;
  const r = Math.hypot(p[0] - a[0], p[1] - a[1]) / 2;
  remember();
  state.segs.push(
    { c: 'M', p: [a] },
    { c: 'A', arc: [r, r, 0, 0, 1], p: [p] },
    { c: 'A', arc: [r, r, 0, 1, 1], p: [[...a]] },
    { c: 'Z', p: [] },
  );
  render();
}

function drawCirclePreview(evt) {
  const g = $('pen');
  g.innerHTML = '';
  const a = state.circleStart;
  if (!a) return;
  const b = toSvg(evt);
  const dash = { fill: 'none', stroke: 'var(--accent)', 'stroke-width': 0.08, 'stroke-dasharray': '0.3 0.2' };
  el('circle', { cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2, r: Math.hypot(b[0] - a[0], b[1] - a[1]) / 2, ...dash }, g);
  el('circle', { cx: a[0], cy: a[1], r: 0.25, fill: 'var(--accent)' }, g);
}

/** Every arc between two moves shares one r, so both halves of a circle change together. */
function setRadius(si, r) {
  let start = si, end = si;
  while (start > 0 && state.segs[start].c !== 'M') start--;
  while (end + 1 < state.segs.length && state.segs[end + 1].c !== 'M') end++;
  for (let i = start; i <= end; i++) if (state.segs[i].c === 'A') state.segs[i].arc[0] = state.segs[i].arc[1] = r;
}

let drag = null;
$('canvas').addEventListener('pointerdown', (evt) => {
  if (state.tool === 'pen') return penClick(evt);
  if (state.tool === 'circle') return circleClick(evt);
  const grp = evt.target.closest('.handle');
  if (!grp) return;
  const si = +grp.dataset.si, pi = +grp.dataset.pi;
  remember();
  state.selected = { si, pi };
  drag = { refs: joined(si, pi) };
  $('canvas').setPointerCapture(evt.pointerId);
  render();
});
$('canvas').addEventListener('pointermove', (evt) => {
  const [x, y] = toSvg(evt);
  $('hover').textContent = `x ${fmt(x)}, y ${fmt(y)}`;
  if (state.tool === 'pen') drawPenLine(evt);
  if (state.tool === 'circle') drawCirclePreview(evt);
  if (!drag) return;
  for (const [si, pi] of drag.refs) state.segs[si].p[pi] = [x, y];
  render({ rebuild: false });
});
$('canvas').addEventListener('pointerup', () => {
  if (drag) render();
  drag = null;
});
$('canvas').addEventListener('pointerleave', () => {
  if (!drag) $('hover').innerHTML = '&nbsp;';
  $('pen').innerHTML = '';
});
$('canvas').addEventListener('dblclick', () => { if (state.tool === 'pen') endPen(); });

$('points').addEventListener('focusin', () => remember());
$('points').addEventListener('input', (evt) => {
  const tr = evt.target.closest('tr');
  const v = parseFloat(evt.target.value);
  if (Number.isNaN(v)) return;
  const si = +tr.dataset.si, pi = +tr.dataset.pi;
  if ('r' in evt.target.dataset) setRadius(si, v);
  else for (const [i, j] of joined(si, pi)) state.segs[i].p[j][evt.target.dataset.axis] = v;
  state.selected = { si, pi };
  render({ rebuild: false });
});

$('d').addEventListener('focus', () => remember());
$('d').addEventListener('input', () => {
  try {
    state.segs = absolutize(parse($('d').value));
    resetDraft();
    $('error').textContent = '';
    render();
  } catch (err) {
    $('error').textContent = err.message;
  }
});

$('controls').addEventListener('change', () => render());
$('undo').addEventListener('click', undo);
document.addEventListener('keydown', (evt) => {
  if ((evt.metaKey || evt.ctrlKey) && evt.key === 'z' && document.activeElement.tagName !== 'TEXTAREA') { evt.preventDefault(); undo(); }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName) || evt.metaKey || evt.ctrlKey) return;
  if (evt.key === 'p') setTool('pen');
  else if (evt.key === 'v') setTool('select');
  else if (evt.key === 'c') setTool('circle');
  else if (evt.key === 'Escape' || evt.key === 'Enter') endDraft();
});
for (const t of Object.keys(TOOL_HINTS)) $(`tool-${t}`).addEventListener('click', () => setTool(t));
$('copy').addEventListener('click', () => navigator.clipboard.writeText(cleanSvg()));

async function load(file) {
  const text = await (await fetch(`/icons/${file}`)).text();
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const root = doc.documentElement;
  state.file = file;
  state.mode = root.getAttribute('fill') === 'none' ? 'stroke' : 'fill';
  const d = [...doc.querySelectorAll('path')].map((p) => p.getAttribute('d')).join(' ');
  state.segs = absolutize(parse(d));
  resetDraft();
  state.history = [];
  state.selected = null;
  $('error').textContent = root.getAttribute('viewBox') === '0 0 24 24' ? '' : `viewBox is "${root.getAttribute('viewBox')}", not "0 0 24 24"`;
  history.replaceState(null, '', `?file=${file}`);
  render();
}

async function init() {
  drawGrid();
  const files = await (await fetch('/icons')).json();
  $('file').replaceChildren(...files.map((f) => new Option(f)));
  const wanted = new URLSearchParams(location.search).get('file');
  const file = files.includes(wanted) ? wanted : files[0];
  $('file').value = file;
  $('file').addEventListener('change', () => load($('file').value));
  await load(file);
}

/** Read access for the agent: the current path data and the clean SVG. */
window.iconEditor = {
  get file() { return state.file; },
  get d() { return serialize(state.segs); },
  get svg() { return cleanSvg(); },
  load,
};

init();
</script>
</body>
</html>
